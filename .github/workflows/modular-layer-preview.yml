name: Modular Layer Preview

on:
  pull_request:
    paths:
      - 'scripts/build_modular_layers.py'
      - '.github/workflows/modular-layer-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python scripts/build_modular_layers.py
      - uses: actions/upload-artifact@v4
        with:
          name: elenya-modular-layer-preview
          path: build/modular-preview/elenya/
          if-no-files-found: error
