name: Modular Layer Preview

on:
  pull_request:
    paths:
      - 'scripts/build_modular_layers.py'
      - '.github/workflows/modular-layer-preview.yml'

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - run: python scripts/build_modular_layers.py
      - uses: actions/upload-artifact@v4
        with:
          name: elenya-modular-layer-preview
          path: build/modular-preview/elenya/
          if-no-files-found: error
      - name: Commit generated Elenya layers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-v56/modular/elenya/ game-v56/modular/manifest.json
          if git diff --cached --quiet; then
            echo "No generated asset changes."
          else
            git commit -m "assets: generate soft modular layers for Elenya"
            git push origin HEAD:${{ github.head_ref }}
          fi
